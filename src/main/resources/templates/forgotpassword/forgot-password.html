<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<section class="auth-page">

    <div class="auth-container">

        <!-- LEFT SIDE -->
        <div class="auth-left">

            <div class="auth-content">

                <h4>🧳 TRIPINAJA</h4>

                <h1>
                    Forgot your
                    <span>password?</span>
                </h1>

                <p>
                    Don't worry, we’ll help you recover
                    your account quickly and securely.
                </p>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="auth-right">

            <div class="auth-form">

                <h1>Reset Password</h1>

                <p>
                    Enter your email and your new password
                    to restore access to your account.
                </p>

                <!-- Static Feedback Messages -->
                <div th:if="${success}" class="auth-feedback auth-feedback-success" style="margin-bottom: 20px;">
                    <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                </div>

                <div th:if="${error}" class="auth-feedback auth-feedback-error" style="margin-bottom: 20px;">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                </div>

                <form th:action="@{/auth/forgot-password}" method="post">

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-icon">
                            <input id="email" name="email" type="email" placeholder="example@gmail.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="newPassword">New Password</label>
                        <div class="input-icon">
                            <input id="newPassword" name="newPassword" type="password" placeholder="********" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <div class="input-icon">
                            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="********" required>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn">
                        Reset Password
                    </button>

                </form>

                <div class="switch-auth">
                    Remember your password?
                    <a href="/login">Back to Login</a>
                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
