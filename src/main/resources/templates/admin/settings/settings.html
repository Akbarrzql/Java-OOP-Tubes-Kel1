<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .settings-section {
            background: white;
            border-radius: 20px;
            padding: 32px;
            border: 1px solid #E5E7EB;
            margin-bottom: 24px;
        }

        .settings-section h2 {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .settings-section>p {
            font-size: 13px;
            color: #6B7280;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .input-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            color: #374151;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #A57249;
            box-shadow: 0 0 0 3px rgba(165, 114, 73, 0.15);
        }

        .empty-state {
            text-align: center;
            padding: 48px 0;
            color: #9CA3AF;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .badge-admin {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background-color: #F0FDF4;
            color: #16A34A;
            border: 1px solid #BBF7D0;
        }

        .feedback-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-success {
            background-color: #e8f7ec;
            color: #16794c;
            border: 1px solid #bfe7cf;
        }

        .feedback-error {
            background-color: #fdecec;
            color: #b42318;
            border: 1px solid #f5c2c7;
        }
    </style>
</head>

<body class="admin-body">

    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar :: adminSidebar('settings')"></div>

    <!-- MAIN -->
    <main class="main-content">

        <!-- TOPBAR -->
        <div th:replace="fragments/admin-topbar :: adminTopbar('Pengaturan', 'Kelola akses admin sistem')"></div>

        <!-- FEEDBACK -->
        <div th:if="${success}" class="feedback-message feedback-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="feedback-message feedback-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- TAMBAH ADMIN -->
        <div class="settings-section">
            <h2>Tambah Admin Baru</h2>
            <p>Masukkan email user yang sudah terdaftar untuk menjadikannya admin.</p>
            <form action="/admin/settings/add" method="post">
                <div class="input-row">
                    <div class="form-group">
                        <label>Email User</label>
                        <input type="email" name="email" placeholder="Masukkan email user" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-user-plus"></i>
                        Tambahkan
                    </button>
                </div>
            </form>
        </div>

        <!-- DAFTAR ADMIN -->
        <div class="settings-section">
            <h2>Daftar Admin</h2>
            <p>Seluruh akun yang memiliki hak akses administratif.</p>

            <div th:if="${adminUserList == null or adminUserList.isEmpty()}" class="empty-state">
                <i class="fas fa-users"></i>
                <p>Belum ada admin tambahan.</p>
            </div>

            <table class="transport-table" th:if="${adminUserList != null and !adminUserList.isEmpty()}">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user, iterStat : ${adminUserList}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.email}"></td>
                        <td><span class="badge-admin">Aktif</span></td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{/admin/settings/remove/{id}(id=${user.id})}"
                                    onclick="return confirm('Yakin ingin mencabut hak akses admin dari user ini?')"
                                    style="background:#FEF2F2; color:#DC2626;">
                                    Hapus Akses
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>

</html>
