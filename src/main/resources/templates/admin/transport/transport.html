<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport Management</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="admin-body">

<!-- SIDEBAR -->
<div th:replace="~{fragments/admin-sidebar :: adminSidebar('transport')}"></div>

<!-- MAIN -->
<main class="main-content">

    <!-- TOPBAR -->
    <div th:replace="~{fragments/admin-topbar :: adminTopbar('Transport Management', 'Kelola seluruh data transportasi')}"></div>

    <!-- ACTION -->
    <div class="page-action">
        <button class="btn-primary" onclick="openTransportModal()">
            <i class="fas fa-plus"></i> Tambah Transport
        </button>
    </div>

    <!-- TABLE -->
    <section class="table-wrapper">
        <table class="transport-table">
            <thead>
                <tr>
                    <th>Jenis</th>
                    <th>Provider</th>
                    <th>Jadwal</th>
                    <th>Harga</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="transport : ${listTransport}" th:data-id="${transport.transportId}" th:data-jenis="${transport.jenis}" th:data-provider="${transport.provider}" th:data-jadwal="${transport.jadwal}" th:data-harga="${transport.harga}" th:data-provinsi="${transport.provinsiId}">
                    <td>
                        <div class="transport-type">
                            <div class="transport-icon">
                                <i th:class="${transport.jenis == 'Flight' or transport.jenis == 'Pesawat' ? 'fas fa-plane' : (transport.jenis == 'Train' or transport.jenis == 'Kereta' ? 'fas fa-train' : 'fas fa-bus')}"></i>
                            </div>
                            <span th:text="${transport.jenis}">Flight</span>
                        </div>
                    </td>
                    <td th:text="${transport.provider}">Garuda Indonesia</td>
                    <td th:text="${transport.jadwal}">08:00 - 10:00</td>
                    <td class="price" th:text="${transport.harga != null} ? 'Rp ' + ${#numbers.formatDecimal(transport.harga, 0, 'POINT', 0, 'COMMA')} : 'Rp 0'">Rp 1.500.000</td>
                    <td>
                        <div class="table-actions">
                            <button type="button" class="btn-edit" th:onclick="openEditFromRow(this)">Edit</button>
                            <a th:href="@{/admin/transport/delete/{id}(id=${transport.transportId})}" onclick="return confirm('Apakah Anda yakin ingin menghapus data transportasi ini?')">Hapus</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<!-- ==================== MODAL EDIT ==================== -->
<div class="modal-overlay" id="editTransportModal">
    <div class="modern-modal">
        <button class="modal-close" onclick="closeEditTransportModal()">
            <i class="fas fa-times"></i>
        </button>
        <div class="modal-header">
            <div class="modal-icon"><i class="fas fa-pen"></i></div>
            <div>
                <h3>Edit Transport</h3>
                <p>Update data transportasi</p>
            </div>
        </div>
        <form class="modern-form" th:action="@{/admin/transport/update}" method="POST">
            <input type="hidden" id="editTransportId" name="transportId">
            <input type="hidden" id="editProvinsiId" name="provinsiId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Jenis</label>
                    <select id="editJenis" name="jenis">
                        <option value="Flight">Flight</option>
                        <option value="Train">Train</option>
                        <option value="Bus">Bus</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Provider</label>
                    <input type="text" id="editProvider" name="provider" required>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Jadwal</label>
                    <input type="text" id="editJadwal" name="jadwal" required>
                </div>
                <div class="form-group">
                    <label>Harga</label>
                    <input type="number" id="editHarga" name="harga" required>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeEditTransportModal()">Cancel</button>
                <button type="submit" class="btn-primary">Update Transport</button>
            </div>
        </form>
    </div>
</div>

<!-- ==================== MODAL TAMBAH ==================== -->
<div class="modal-overlay" id="transportModal">
    <div class="modern-modal">
        <button class="modal-close" onclick="closeTransportModal()">
            <i class="fas fa-times"></i>
        </button>
        <div class="modal-header">
            <div class="modal-icon"><i class="fas fa-bus"></i></div>
            <div>
                <h3>Tambah Transport</h3>
                <p>Tambahkan data transportasi baru</p>
            </div>
        </div>
        <form class="modern-form" th:action="@{/admin/transport/save}" method="POST">
            <input type="hidden" name="provinsiId" value="1">
            <div class="form-grid">
                <div class="form-group">
                    <label>Jenis Transport</label>
                    <select name="jenis">
                        <option value="Flight">Flight</option>
                        <option value="Train">Train</option>
                        <option value="Bus">Bus</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nama Provider</label>
                    <input type="text" name="provider" placeholder="Garuda Indonesia" required>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Jadwal</label>
                    <input type="text" name="jadwal" placeholder="08:00 - 10:00" required>
                </div>
                <div class="form-group">
                    <label>Harga Base</label>
                    <input type="number" id="hargaInput" name="harga" placeholder="1500000" required>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Pajak & Biaya Tambahan</label>
                    <input type="number" id="feeInput" placeholder="250000">
                </div>
                <div class="form-group">
                    <label>Estimasi Total Cost</label>
                    <input type="text" id="totalCost" readonly>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeTransportModal()">Cancel</button>
                <button type="submit" class="btn-primary">Save Transport</button>
            </div>
        </form>
    </div>
</div>

<script>
    const modal = document.getElementById('transportModal');
    const editTransportModal = document.getElementById('editTransportModal');

    // ========== MODAL TAMBAH ==========
    function openTransportModal(){ modal.classList.add('active'); }
    function closeTransportModal(){ modal.classList.remove('active'); }

    // ========== MODAL EDIT (dari data attribute) ==========
    function openEditFromRow(button) {
        const row = button.closest('tr');
        const id = row.getAttribute('data-id');
        const jenis = row.getAttribute('data-jenis');
        const provider = row.getAttribute('data-provider');
        const jadwal = row.getAttribute('data-jadwal');
        const harga = row.getAttribute('data-harga');
        const provinsiId = row.getAttribute('data-provinsi');

        document.getElementById('editTransportId').value = id;
        document.getElementById('editProvinsiId').value = provinsiId;
        document.getElementById('editJenis').value = jenis;
        document.getElementById('editProvider').value = provider;
        document.getElementById('editJadwal').value = jadwal;
        document.getElementById('editHarga').value = harga;

        editTransportModal.classList.add('active');
    }

    function closeEditTransportModal(){ editTransportModal.classList.remove('active'); }

    // ========== CLOSE KETIKA KLIK DI LUAR ==========
    modal.addEventListener('click', function(e){ if(e.target === modal){ closeTransportModal(); } });
    editTransportModal.addEventListener('click', function(e){ if(e.target === editTransportModal){ closeEditTransportModal(); } });

    // ========== KALKULASI TOTAL COST ==========
    const hargaInput = document.getElementById('hargaInput');
    const feeInput = document.getElementById('feeInput');
    const totalCost = document.getElementById('totalCost');

    function calculateTotal(){
        const harga = parseInt(hargaInput.value) || 0;
        const fee = parseInt(feeInput.value) || 0;
        const total = harga + fee;
        totalCost.value = 'Rp ' + total.toLocaleString('id-ID');
    }

    hargaInput.addEventListener('input', calculateTotal);
    feeInput.addEventListener('input', calculateTotal);
</script>

</body>
</html>
