<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Province - TRIPINAJA</title>
    <style>
        /* ==========================================================================
           RESET & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            display: flex;
            background-color: #f4f4f4;
            color: #333333;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        /* ==========================================================================
           SIDEBAR STYLES (Fixed width)
           ========================================================================== */
        .sidebar {
            width: 260px;
            background-color: #ffffff;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .sidebar .logo {
            margin-bottom: 28px;
        }

        .sidebar .logo h2 {
            color: #8B6E3C;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sidebar .logo p {
            font-size: 10px;
            color: #a0a0a0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .sidebar .create-btn {
            background-color: #8B6E3C;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 28px;
            transition: all 0.2s ease;
        }

        .sidebar .create-btn:hover {
            background-color: #755b31;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .sidebar nav a {
            color: #555555;
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .sidebar nav a:hover {
            color: #8B6E3C;
            background-color: #fdfaf4;
        }

        .sidebar nav a.active {
            color: #8B6E3C;
            background-color: #f4eee4; 
            font-weight: 600;
        }

        /* ==========================================================================
           MAIN CONTENT STYLES (Melebar Proporsional)
           ========================================================================== */
        .content {
            margin-left: 260px;
            flex-grow: 1;
            padding: 40px;
            width: calc(100% - 260px);
        }

        /* Page Header */
        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 28px;
            color: #222222;
            font-weight: 700;
        }

        .page-header p {
            color: #666666;
            font-size: 14px;
            margin-top: 4px;
        }

        /* Form Card - Mengikuti lebar halaman */
        .form-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.02);
            padding: 32px;
            width: 100%;
        }

        .form-group {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Input & Textarea Styling */
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #f9f9f9;
            border: 1px solid #dddddd;
            border-radius: 8px;
            color: #333333;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            border-color: #8B6E3C;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(139, 110, 60, 0.15);
        }

        /* Khusus input readonly (ID) agar terlihat terkunci tapi tetap bersih */
        .form-group input[readonly] {
            background-color: #f0f0f0;
            color: #888888;
            border-color: #e0e0e0;
            cursor: not-allowed;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Button Layout */
        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 32px;
            border-top: 1px solid #f0f0f0;
            padding-top: 24px;
        }

        .cancel-btn {
            display: inline-block;
            background-color: #f4f4f4;
            color: #555555;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #dddddd;
            transition: all 0.2s ease;
        }

        .cancel-btn:hover {
            background-color: #eaeaea;
            color: #222222;
        }

        .save-btn {
            background-color: #8B6E3C;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .save-btn:hover {
            background-color: #755b31;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="logo">
            <h2>TRIPINAJA</h2>
            <p>PREMIUM TRAVEL ADMIN</p>
        </div>

        <button class="create-btn">
            Create New Trip
        </button>

        <nav>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/province" class="active">Provinces</a>
            <a href="#">Destinations</a>
            <a href="#">Itineraries</a>
            <a href="/admin/transport">Transport</a>
            <a href="#">Settings</a>
        </nav>
    </div>

    <div class="content">
        <div class="page-header">
            <h1>Edit Province</h1>
            <p>Update province information.</p>
        </div>

        <div class="form-card">
            <form>
                <div class="form-group">
                    <label>Province ID</label>
                    <input type="text" value="1" readonly>
                </div>

                <div class="form-group">
                    <label>Province Name</label>
                    <input type="text" value="Bali">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea rows="5">Island tourism destination.</textarea>
                </div>

                <div class="button-group">
                    <a href="/admin/province" class="cancel-btn">Cancel</a>
                    <button type="submit" class="save-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
