<!DOCTYPE html>
<html lang="id"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Accommodation Management
    </title>

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="admin-body">

<div th:replace="
fragments/admin-sidebar ::
adminSidebar('accommodation')">
</div>

<main class="main-content">

    <div th:replace="
    fragments/admin-topbar ::
    adminTopbar(
        'Accommodation Management',
        'Kelola seluruh penginapan'
    )">
    </div>

    <div class="page-action">

        <button class="btn-primary"
                onclick="openAccommodationModal()">

            <i class="fas fa-plus"></i>

            Tambah Akomodasi

        </button>

    </div>

    <!-- TABLE -->
    <section class="table-wrapper">

        <table class="transport-table">

            <thead>

            <tr>

                <th>Nama</th>
                <th>Lokasi</th>
                <th>Harga / Malam</th>
                <th>Rating</th>
                <th>Availability</th>
                <th>Aksi</th>

            </tr>

            </thead>

            <tbody>

            <tr>

                <td>Hotel Santika</td>
                <td>Bali</td>
                <td>Rp 850.000</td>
                <td>4.8 ⭐</td>
                <td>Available</td>

                <td>

                    <div class="table-actions">

                        <!-- BUTTON EDIT -->
                        <button
                                onclick="
openEditAccommodationModal(
'1',
'Hotel Santika',
'Bali',
'850000',
'4.8',
'Available',
'WiFi, Pool'
)
">

                            Edit

                        </button>

                        <!-- EDIT MODAL -->
                        <div class="modal-overlay"
                             id="editAccommodationModal">

                            <div class="modern-modal">

                                <button class="modal-close"
                                        onclick="closeEditAccommodationModal()">

                                    <i class="fas fa-times"></i>

                                </button>

                                <div class="modal-header">

                                    <div class="modal-icon">

                                        <i class="fas fa-hotel"></i>

                                    </div>

                                    <div>

                                        <h3>Edit Accommodation</h3>

                                        <p>Update data penginapan</p>

                                    </div>

                                </div>

                                <form class="modern-form">

                                    <input type="hidden"
                                           id="editAccommodationId">

                                    <div class="form-grid">

                                        <div class="form-group">

                                            <label>Nama</label>

                                            <input type="text"
                                                   id="editAccommodationName">

                                        </div>

                                        <div class="form-group">

                                            <label>Lokasi</label>

                                            <input type="text"
                                                   id="editAccommodationLocation">

                                        </div>

                                    </div>

                                    <div class="form-grid">

                                        <div class="form-group">

                                            <label>Harga / Malam</label>

                                            <input type="number"
                                                   id="editAccommodationPrice">

                                        </div>

                                        <div class="form-group">

                                            <label>Rating</label>

                                            <input type="number"
                                                   step="0.1"
                                                   id="editAccommodationRating">

                                        </div>

                                    </div>

                                    <div class="form-group">

                                        <label>Availability</label>

                                        <select id="editAccommodationAvailability">

                                            <option>
                                                Available
                                            </option>

                                            <option>
                                                Full Booked
                                            </option>

                                        </select>

                                    </div>

                                    <div class="form-group">

                                        <label>Fasilitas</label>

                                        <textarea rows="5"
                                                  id="editAccommodationFacility"></textarea>

                                    </div>

                                    <div class="form-actions">

                                        <button type="button"
                                                class="btn-secondary"
                                                onclick="closeEditAccommodationModal()">

                                            Cancel

                                        </button>

                                        <button type="submit"
                                                class="btn-primary">

                                            Update Accommodation

                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                        <script>

                            const editAccommodationModal =
                                document.getElementById(
                                    'editAccommodationModal'
                                );

                            function openEditAccommodationModal(
                                id,
                                name,
                                location,
                                price,
                                rating,
                                availability,
                                facility
                            ){

                                editAccommodationModal.classList.add(
                                    'active'
                                );

                                document.getElementById(
                                    'editAccommodationId'
                                ).value = id;

                                document.getElementById(
                                    'editAccommodationName'
                                ).value = name;

                                document.getElementById(
                                    'editAccommodationLocation'
                                ).value = location;

                                document.getElementById(
                                    'editAccommodationPrice'
                                ).value = price;

                                document.getElementById(
                                    'editAccommodationRating'
                                ).value = rating;

                                document.getElementById(
                                    'editAccommodationAvailability'
                                ).value = availability;

                                document.getElementById(
                                    'editAccommodationFacility'
                                ).value = facility;

                            }

                            function closeEditAccommodationModal(){

                                editAccommodationModal.classList.remove(
                                    'active'
                                );

                            }

                        </script>

                        <a href="#">
                            Hapus
                        </a>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </section>

</main>

<!-- MODAL -->
<div class="modal-overlay"
     id="accommodationModal">

    <div class="modern-modal">

        <button class="modal-close"
                onclick="closeAccommodationModal()">

            <i class="fas fa-times"></i>

        </button>

        <div class="modal-header">

            <div class="modal-icon">

                <i class="fas fa-hotel"></i>

            </div>

            <div>

                <h3>
                    Tambah Akomodasi
                </h3>

                <p>
                    Tambahkan hotel/penginapan baru
                </p>

            </div>

        </div>

        <form class="modern-form">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Nama Akomodasi
                    </label>

                    <input type="text"
                           placeholder="Hotel Santika">

                </div>

                <div class="form-group">

                    <label>
                        Lokasi
                    </label>

                    <input type="text"
                           placeholder="Bali">

                </div>

            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Harga Per Malam
                    </label>

                    <input type="number"
                           placeholder="850000">

                </div>

                <div class="form-group">

                    <label>
                        Rating
                    </label>

                    <input type="number"
                           step="0.1"
                           placeholder="4.8">

                </div>

            </div>

            <div class="form-group">

                <label>
                    Availability
                </label>

                <select>

                    <option>
                        Available
                    </option>

                    <option>
                        Full Booked
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>
                    Fasilitas
                </label>

                <textarea rows="5"
                          placeholder="WiFi, Pool, Breakfast"></textarea>

            </div>

            <div class="form-actions">

                <button type="button"
                        class="btn-secondary"
                        onclick="closeAccommodationModal()">

                    Cancel

                </button>

                <button type="submit"
                        class="btn-primary">

                    Save Accommodation

                </button>

            </div>

        </form>

    </div>

</div>

<script>

    const accommodationModal =
        document.getElementById(
            'accommodationModal'
        );

    function openAccommodationModal(){

        accommodationModal.classList.add(
            'active'
        );

    }

    function closeAccommodationModal(){

        accommodationModal.classList.remove(
            'active'
        );

    }

</script>

</body>
</html>
