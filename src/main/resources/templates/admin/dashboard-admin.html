<!DOCTYPE html>
<html lang="id"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Dashboard
    </title>

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="admin-body">

<!-- SIDEBAR -->
<div th:replace="fragments/admin-sidebar :: adminSidebar('dashboard')">
</div>

<!-- MAIN -->
<main class="main-content">

    <!-- TOPBAR -->
    <div th:replace="
        fragments/admin-topbar ::
        adminTopbar(
            'Dashboard',
            'Ringkasan aktivitas admin'
        )">
    </div>

    <!-- STATS -->
    <section class="admin-stats">

        <div class="admin-card">
            <h3>Total Provinces</h3>
            <span>12</span>
        </div>

        <div class="admin-card">
            <h3>Total Destinations</h3>
            <span>48</span>
        </div>

        <div class="admin-card">
            <h3>Total Accommodations</h3>
            <span>37</span>
        </div>

    </section>

</main>

</body>
</html>
