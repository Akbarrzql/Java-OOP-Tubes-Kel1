<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<section class="auth-page">

  <div class="auth-container">

    <div class="auth-left">

      <div class="overlay"></div>

      <div class="auth-content">
        <h4>🧳 TRIPINAJA</h4>

        <h1>
          Plan your next
          <span>adventure</span>
          with confidence
        </h1>

        <p>Smart Travel Itinerary</p>
      </div>

    </div>

    <div class="auth-right">

      <div class="auth-form">

        <h1>Login Now!</h1>
        <p>Welcome back! Please enter your details</p>

        <!-- Static Feedback Messages -->
        <div th:if="${success}" class="auth-feedback auth-feedback-success" style="margin-bottom: 20px;">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="auth-feedback auth-feedback-error" style="margin-bottom: 20px;">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/auth/login}" method="post">

          <div class="input-group">
            <label class="sr-only" for="loginEmail">Email</label>
            <input id="loginEmail" type="email" name="email" placeholder="example@gmail.com" title="Masukkan email yang valid" required>
          </div>

          <div class="input-group">
            <label class="sr-only" for="loginPassword">Password</label>
            <input id="loginPassword" type="password" name="password" placeholder="********" title="Masukkan password Anda" required>
          </div>

          <div class="auth-options">
            <div>
              <input id="rememberMe" type="checkbox" name="rememberMe">
              <label for="rememberMe">Remember me</label>
            </div>

            <a href="/forgot-password">Forgot password?</a>
          </div>

          <button type="submit" class="auth-btn">
            Log in
          </button>

        </form>

        <div class="switch-auth">
          Don't have an account?
          <a href="/register">Sign Up</a>
        </div>

      </div>

    </div>

  </div>

</section>
<link rel="stylesheet" th:href="@{/css/responsive.css}">
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
