<!DOCTYPE html>
<html lang="id"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pilih Transportasi - Tripinaja</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/traveler.css}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6B5E4A',
                        accent: '#A68A64',
                        bglight: '#FAFAFA'
                    },

                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif']
                    }
                }
            }
        }
    </script>

</head>

<body class="bg-bglight font-sans text-gray-800 min-h-screen">

<div class="max-w-6xl mx-auto p-8">

    <!-- HEADER -->
    <header class="
        flex
        justify-between
        items-center
        mb-8
        relative
    ">

        <button class="
            text-gray-600
            hover:text-primary
            font-medium
            text-sm
            flex
            items-center
            gap-2
        ">

            <i class="fas fa-chevron-left"></i>

            Kembali ke Itinerary

        </button>

        <h1 class="
            font-serif
            text-3xl
            font-bold
            text-primary
            absolute
            left-1/2
            transform
            -translate-x-1/2
        ">

            Pilih Transportasi

        </h1>

    </header>

    <!-- FILTER -->
    <div class="
        bg-white
        p-4
        rounded-xl
        shadow-sm
        border
        border-gray-100
        flex
        flex-wrap
        gap-4
        justify-between
        items-center
        mb-8
    ">

        <!-- SEARCH -->
        <div class="
            relative
            flex-1
            min-w-[250px]
        ">

            <i class="
                fas fa-search
                absolute
                left-4
                top-1/2
                transform
                -translate-y-1/2
                text-gray-400
            "></i>

            <input
                    type="text"
                    id="searchInput"

                    placeholder="Cari Provider..."

                    class="
                        w-full
                        pl-10
                        pr-4
                        py-2.5
                        border
                        border-gray-200
                        rounded-lg
                        text-sm
                        focus:outline-none
                    "
            >

        </div>

        <!-- FILTER -->
        <div class="flex gap-4">

            <!-- JENIS -->
            <div class="relative">

                <select
                        id="jenisFilter"

                        class="
                            appearance-none
                            bg-white
                            border
                            border-gray-200
                            text-gray-700
                            py-2.5
                            pl-4
                            pr-10
                            rounded-lg
                            text-sm
                            focus:outline-none
                            cursor-pointer
                            font-medium
                        "
                >

                    <option>Semua Jenis</option>
                    <option>Pesawat</option>
                    <option>Kereta</option>
                    <option>Bus</option>

                </select>

                <i class="
                    fas fa-chevron-down
                    absolute
                    right-4
                    top-1/2
                    transform
                    -translate-y-1/2
                    text-gray-400
                    text-xs
                    pointer-events-none
                "></i>

            </div>

            <!-- SORT -->
            <div class="relative">

                <select
                        id="hargaSort"

                        class="
                            appearance-none
                            bg-white
                            border
                            border-gray-200
                            text-gray-700
                            py-2.5
                            pl-4
                            pr-10
                            rounded-lg
                            text-sm
                            focus:outline-none
                            cursor-pointer
                            font-medium
                        "
                >

                    <option>Harga Termurah</option>
                    <option>Harga Tertinggi</option>

                </select>

                <i class="
                    fas fa-chevron-down
                    absolute
                    right-4
                    top-1/2
                    transform
                    -translate-y-1/2
                    text-gray-400
                    text-xs
                    pointer-events-none
                "></i>

            </div>

        </div>

    </div>

    <!-- CARD -->
    <div
            id="transportContainer"

            class="
                grid
                grid-cols-1
                md:grid-cols-2
                lg:grid-cols-3
                gap-6
            "
    >

    </div>

</div>

<!-- JS -->
<script th:src="@{/js/transport.js}"></script>

</body>
</html>
