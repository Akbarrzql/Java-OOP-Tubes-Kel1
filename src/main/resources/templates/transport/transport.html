<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Transportasi - Tripinaja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&family=Merriweather:wght=700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/transport.css}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#6B5E4A', accent: '#A68A64', bglight: '#FAFAFA' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Merriweather', 'serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-bglight font-sans text-gray-800 min-h-screen">

<div class="max-w-6xl mx-auto p-8">

    <header class="flex justify-between items-center mb-8 relative">
        <button class="text-gray-600 hover:text-primary font-medium text-sm flex items-center gap-2">
            <i class="fas fa-chevron-left"></i> Kembali ke Itinerary
        </button>
        <h1 class="font-serif text-3xl font-bold text-primary absolute left-1/2 transform -translate-x-1/2">
            Pilih Transportasi
        </h1>
    </header>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 justify-between items-center mb-8">
        <div class="relative flex-1 min-w-[250px]">
            <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Cari Provider..." class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-accent">
        </div>

        <div class="flex gap-4">
            <div class="relative">
                <select id="jenisFilter" class="appearance-none bg-white border border-gray-200 text-gray-700 py-2.5 pl-4 pr-10 rounded-lg text-sm focus:outline-none focus:border-accent cursor-pointer font-medium">
                    <option value="Semua Jenis">Semua Jenis</option>
                    <option value="Pesawat">Pesawat (Flight)</option>
                    <option value="Kereta">Kereta (Train)</option>
                    <option value="Bus">Bus</option>
                </select>
                <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
            </div>

            <div class="relative">
                <select id="hargaSort" class="appearance-none bg-white border border-gray-200 text-gray-700 py-2.5 pl-4 pr-10 rounded-lg text-sm focus:outline-none focus:border-accent cursor-pointer font-medium">
                    <option value="Termurah">Harga Termurah</option>
                    <option value="Tertinggi">Harga Tertinggi</option>
                </select>
                <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
            </div>
        </div>
    </div>

    <div id="transportContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <div th:each="transport : ${listTransport}" 
             class="transport-card bg-white rounded-xl border border-gray-100 p-6 shadow-sm hover:shadow-md transition duration-300 flex flex-col justify-between"
             th:data-jenis="${transport.jenis}"
             th:data-provider="${transport.provider.toLowerCase()}"
             th:data-harga="${transport.harga}">
            
            <div>
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-semibold uppercase tracking-wider text-accent bg-[#F4EFE6] px-2.5 py-1 rounded-full" th:text="${transport.jenis}">
                        Flight
                    </span>
                    <div class="text-gray-400 text-lg">
                        <i th:class="${transport.jenis == 'Flight' ? 'fas fa-plane' : (transport.jenis == 'Train' ? 'fas fa-train' : 'fas fa-bus-alt')}"></i>
                    </div>
                </div>
                
                <h3 class="font-serif text-xl font-bold text-gray-800 mb-1 provider-name" th:text="${transport.provider}">
                    Garuda Indonesia
                </h3>
                
                <p class="text-sm text-gray-500 flex items-center gap-2 mb-6">
                    <i class="far fa-clock text-xs"></i>
                    <span th:text="${transport.jadwal}">08:00 - 10:00</span>
                </p>
            </div>
            
            <div class="border-t border-gray-50 pt-4 flex items-center justify-between mt-auto">
                <div>
                    <p class="text-[10px] uppercase font-semibold tracking-wider text-gray-400">Harga Base</p>
                    <p class="text-lg font-bold text-primary" th:text="'Rp ' + ${#numbers.formatDecimal(transport.harga, 0, 'POINT', 0, 'COMMA')}">
                        Rp 1.500.000
                    </p>
                </div>
                <button th:onclick="'pilihTransportasi(' + ${transport.transportId} + ')'" class="bg-primary text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-opacity-90 transition shadow-sm">
                    Pilih
                </button>
            </div>
        </div>

    </div>
</div>

<script th:src="@{/js/transport.js}"></script>
</body>
</html>
