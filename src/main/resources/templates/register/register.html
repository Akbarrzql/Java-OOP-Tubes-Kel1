<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/auth.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<section class="auth-page">

    <div class="auth-container">

        <div class="auth-left">

            <div class="overlay"></div>

            <div class="auth-content">
                <h4>🧳 TRIPINAJA</h4>

                <h1>
                    Join thousands
                    of <span>travelers</span>
                    in Indonesia
                </h1>

                <p>Free forever - Easy to use</p>
            </div>

        </div>

        <div class="auth-right">

            <div class="auth-form">

                <h1>Register Now!</h1>
                <p>Register now to start your journey!</p>

                <!-- Static Feedback Messages -->
                <div th:if="${success}" class="auth-feedback auth-feedback-success" style="margin-bottom: 20px;">
                    <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                </div>

                <div th:if="${error}" class="auth-feedback auth-feedback-error" style="margin-bottom: 20px;">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                </div>

                <form th:action="@{/auth/register}" method="post">

                    <div class="input-group">
                        <label class="sr-only" for="registerName">Full Name</label>
                        <input id="registerName" type="text" name="name" placeholder="Nama Lengkap" title="Masukkan nama lengkap Anda" required>
                    </div>

                    <div class="input-group">
                        <label class="sr-only" for="registerEmail">Email</label>
                        <input id="registerEmail" type="email" name="email" placeholder="example@gmail.com" title="Masukkan email yang valid (contoh: user@email.com)" required>
                    </div>

                    <div class="input-group">
                        <label class="sr-only" for="registerPassword">Password</label>
                        <input id="registerPassword" type="password" name="password" placeholder="********" title="Masukkan password minimal 6 karakter" required>
                    </div>

                    <div class="auth-options">
                        <div>
                            <input id="agreeTerms" type="checkbox" required>
                            <label for="agreeTerms">I agree to Terms &amp; Privacy Policy</label>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn">
                        Sign Up
                    </button>

                </form>

                <div class="switch-auth">
                    Already have an account?
                    <a href="/login">Sign In</a>
                </div>

            </div>

        </div>

    </div>

</section>
<link rel="stylesheet" th:href="@{/css/responsive.css}">
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
