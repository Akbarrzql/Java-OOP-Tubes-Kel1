<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Itinerary</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">

</head>
<body>

<nav class="navbar dashboard-navbar">

    <div class="container">

        <div class="logo">
            <span class="logo-icon">◉</span>
            TRIPINAJA
        </div>

        <div class="nav-center">
            <a href="/dashboard">Dashboard</a>
            <a href="/itinerary/list">My Trips</a>
        </div>

        <!-- PROFILE -->
        <a href="/profile" class="profile-menu">
            <div class="profile-avatar">A</div>
            <span class="profile-name">Akbar</span>
        </a>

    </div>

</nav>

<main class="dashboard-main">

    <div class="container">

        <section class="itineraries-section">

            <div class="section-header">

                <h2>Semua Itinerary</h2>

            </div>

            <div class="itineraries-grid">

                <!-- CARD -->
                <div class="itinerary-card">

                    <div class="card-image"
                         style="background:linear-gradient(135deg,#667eea,#764ba2)">
                    </div>

                    <div class="card-content">

                        <div class="card-badge">
                            Aktif
                        </div>

                        <h3>Liburan ke Bali</h3>

                        <p class="card-subtitle">
                            Bali, Indonesia
                        </p>

                        <a href="#"
                           class="btn-card">
                            Detail Itinerary
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </div>

</main>

</body>
</html>
